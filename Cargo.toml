[package]
name = "refsyn"
version = "0.1.0"
edition = "2021"

[dependencies]
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
tokio = { version = "1.0", features = ["full"] }
http = "0.2"
uuid = { version = "1.8.0", features = ["v4", "macro-diagnostics"] }
